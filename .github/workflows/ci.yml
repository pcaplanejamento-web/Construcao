name: CI

# Roda os testes (node --test) + syntax-check do frontend e do backend a cada
# push/PR na main. NÃO publica nada — o deploy do frontend fica no pages.yml e o
# do backend no clasp/wrangler. Objetivo: barrar regressão antes do deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Testes (node --test)
        run: node --test test/*.test.mjs

      - name: Syntax-check do frontend (node --check)
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Syntax-check do backend (.gs → node --check)
        run: |
          for f in apps-script/*.gs; do
            cp "$f" "/tmp/$(basename "$f").js"
            node --check "/tmp/$(basename "$f").js"
          done
