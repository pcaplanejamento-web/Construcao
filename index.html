<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: o conteúdo ocupa a tela inteira (sob o notch/status bar e
         a barra transparente do Safari iOS) — combinado com env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Sistema de Gestão de Obras — cadastre obras e acompanhe despesas em tempo real." />
    <!-- Verificação de propriedade no Google Search Console (para verificação OAuth). -->
    <meta name="google-site-verification" content="i4aV4NFJ4CUxXaVY_iJiBvCqHkU7XJtgpH8MwMcZ7VE" />
    <!-- SEM theme-color (opaco) de propósito: no Safari iOS 26 a barra do navegador
         fica TRANSLÚCIDA (liquid glass), desfocando o conteúdo (escura no tema escuro). -->
    <!-- Modo "app" no iOS/Android (tela cheia ao salvar na tela inicial; status bar translúcida). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dattaobra" />

    <!-- Caminho-base da implantação. Raiz ("/") no domínio próprio (Cloudflare) e
         "/Construcao/" quando servido pelo GitHub Pages (página de projeto). Tem
         de vir ANTES de qualquer CSS/asset para que os caminhos relativos (e os
         relativos dentro dos Shadow DOMs) resolvam no prefixo correto. -->
    <script>
      // Prefixo-base guardado p/ reuso (base + CSS globais). Escrever os CSS com o
      // prefixo ABSOLUTO evita que o preload-scanner os resolva contra a rota atual
      // (ex.: /orcamentos/<id>) ANTES do <base> aplicar → 404 → "Refused to apply style".
      window.__BASE = location.hostname.endsWith("github.io") ? "/Construcao/" : "/";
      document.write('<base href="' + window.__BASE + '">');
    </script>

    <title>Dattaobra</title>
    <link rel="icon" type="image/png" href="src/assets/dattaobra.png" />

    <!-- PWA: app instalável (tela inicial do Android/iPhone, abre em tela cheia).
         O manifest e o ícone respeitam o <base href> acima (raiz ou /Construcao/). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="src/assets/apple-touch-icon.png" />

    <!-- Fontes: Space Grotesk (títulos/números) + Plus Jakarta Sans (corpo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />

    <!-- Google Identity Services (botão "Entrar com Google" no login-form). Carrega
         async: o login-form aguarda window.google e esconde o botão se indisponível. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Aplica o tema salvo antes do CSS (evita flash de tema errado). NÃO tinge o
         chrome do navegador (sem theme-color) → barra do Safari iOS 26 translúcida. -->
    <script>
      try {
        var t = localStorage.getItem("obras.tema");
        if (t === "claro" || t === "escuro")
          document.documentElement.dataset.tema = t;
      } catch (e) {}
    </script>

    <!-- App sem ZOOM (mobile): além do viewport (maximum-scale/user-scalable), o iOS
         ignora user-scalable; então bloqueamos a pinça (gesture*) e o double-tap. -->
    <script>
      (function () {
        ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) {
          document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
        });
        var ult = 0;
        document.addEventListener("touchend", function (e) {
          var agora = Date.now();
          if (agora - ult <= 300) e.preventDefault(); // double-tap zoom
          ult = agora;
        }, { passive: false });
      })();
    </script>

    <!-- Estilos globais (fora do Shadow DOM): tokens, reset e layout. Escritos com o
         prefixo-base ABSOLUTO (window.__BASE) para o preload-scanner nunca resolvê-los
         contra a rota atual (evita o erro de MIME em rotas aninhadas como /orcamentos/:id). -->
    <script>
      document.write(
        '<link rel="stylesheet" href="' + window.__BASE + 'src/styles/tokens.css">' +
        '<link rel="stylesheet" href="' + window.__BASE + 'src/styles/reset.css">' +
        '<link rel="stylesheet" href="' + window.__BASE + 'src/styles/global.css">'
      );
    </script>
    <noscript>
      <link rel="stylesheet" href="src/styles/tokens.css" />
      <link rel="stylesheet" href="src/styles/reset.css" />
      <link rel="stylesheet" href="src/styles/global.css" />
    </noscript>
  </head>
  <body>
    <!-- O app-shell é o único elemento de UI montado diretamente no HTML.
         Ele assume o controle da renderização das views via roteador. -->
    <app-shell></app-shell>

    <!-- Host singleton de notificações (toasts), fora do shell para sobrepor tudo. -->
    <toast-host></toast-host>

    <noscript>
      <p style="padding: 1rem; font-family: sans-serif">
        Este sistema precisa de JavaScript habilitado para funcionar.
      </p>
    </noscript>

    <!-- Ponto de entrada da aplicação. type="module" habilita ES Modules. -->
    <script type="module" src="src/app.js"></script>

    <!-- PWA: registra o service worker (casco offline + instalável). Só em
         HTTPS/localhost; falha em silêncio onde não houver suporte. O caminho
         "sw.js" respeita o <base href> (raiz ou /Construcao/). -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          // Se JÁ havia um SW no controle, uma troca de controlador = versão nova
          // assumiu → recarrega UMA vez p/ pegar o código atual (nunca na 1ª
          // instalação, quando controller é null → sem reload/loop).
          if (navigator.serviceWorker.controller) {
            var recarregando = false;
            navigator.serviceWorker.addEventListener("controllerchange", function () {
              if (recarregando) return;
              recarregando = true;
              window.location.reload();
            });
          }
          navigator.serviceWorker
            .register("sw.js")
            .then(function (reg) {
              // Procura versão nova ao abrir e sempre que o app volta ao foco
              // (ex.: reabrir o PWA instalado) → atualização chega sem passo manual.
              reg.update();
              document.addEventListener("visibilitychange", function () {
                if (document.visibilityState === "visible") reg.update();
              });
            })
            .catch(function () {});
        });
      }
    </script>
  </body>
</html>
